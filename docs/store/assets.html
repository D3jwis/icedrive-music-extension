<!doctype html>
<!-- Source of the Chrome Web Store images in docs/store/. Re-render with: node docs/store/render.mjs -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#171b2a; --surface:#202639; --text:#e9ecf5; --muted:#8f97ad; --accent:#17a1a2; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: var(--text); overflow: hidden;
    background:
      radial-gradient(900px 500px at 85% 120%, rgba(23,161,162,.35), transparent 60%),
      radial-gradient(600px 400px at 0% 0%, rgba(80,110,220,.18), transparent 60%),
      var(--bg);
  }
  .shot { width: 1280px; height: 800px; display: flex; align-items: center; gap: 70px; padding: 0 90px; }
  .copy { flex: 1; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; font-weight: 700; font-size: 20px; }
  .brand img { width: 56px; height: 56px; }
  h1 { font-size: 52px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  h1 span { color: var(--accent); }
  p { margin-top: 20px; font-size: 24px; color: var(--muted); line-height: 1.45; }
  .frame { border-radius: 18px; overflow: hidden; flex: none;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); }
  .frame img { display: block; }
  .tile { width: 440px; height: 280px; display: flex; flex-direction: column; justify-content: center; padding: 0 36px; }
  .tile img { width: 64px; height: 64px; margin-bottom: 18px; }
  .tile h1 { font-size: 34px; }
  .tile p { font-size: 17px; margin-top: 10px; }
</style>
</head>
<body>
<script>
  // ?v=popup | mini | inpage | tile. Content is fixed text, built with DOM APIs.
  const shots = {
    popup: { img: '../images/popup.png', w: 380, title: ['Now playing, ', 'in one click'], text: 'Album art, seek bar, shuffle, repeat and the whole folder as a queue, right under the toolbar icon.' },
    mini: { img: '../images/detached-window.png', w: 400, title: ['A mini player that ', 'stays open'], text: 'Pop the player out into its own window and keep control while you work in other tabs.' },
    inpage: { img: '../images/in-page-controls.png', w: 700, title: ['Right inside ', 'Icedrive'], text: 'Shuffle, previous, next and repeat buttons added under Icedrive’s own player.' },
  };
  const v = new URLSearchParams(location.search).get('v') || 'popup';
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  const icon = () => { const i = el('img'); i.src = '../../assets-src/icon.svg'; i.alt = ''; return i; };
  if (v === 'tile') {
    const t = el('div', 'tile');
    const h = el('h1'); h.append('Icedrive Music ', el('span', '', 'Player+'));
    t.append(icon(), h, el('p', '', 'Shuffle, repeat, queue, media keys and a mini player for Icedrive.'));
    document.body.append(t);
  } else {
    const s = shots[v];
    const wrap = el('div', 'shot');
    const copy = el('div', 'copy');
    const brand = el('div', 'brand'); brand.append(icon(), 'Icedrive Music Player+');
    const h = el('h1'); h.append(s.title[0], el('span', '', s.title[1]));
    copy.append(brand, h, el('p', '', s.text));
    const frame = el('div', 'frame'); const img = el('img'); img.src = s.img; img.style.width = s.w + 'px'; frame.append(img);
    if (v === 'inpage') { wrap.style.flexDirection = 'column'; wrap.style.justifyContent = 'center'; wrap.style.alignItems = 'flex-start'; copy.style.flex = 'none'; }
    wrap.append(copy, frame);
    document.body.append(wrap);
  }
</script>
</body>
</html>
