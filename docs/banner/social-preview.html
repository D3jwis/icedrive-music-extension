<!doctype html>
<!-- Source of docs/images/social-preview.png (GitHub: Settings > Social preview). Re-render with: node docs/banner/render.mjs -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: #e9ecf5;
    background:
      radial-gradient(700px 420px at 50% 115%, rgba(8,200,209,.30), transparent 60%),
      radial-gradient(600px 400px at 0% 0%, rgba(20,89,196,.25), transparent 60%),
      #171b2a;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  svg { width: 260px; height: 260px; filter: drop-shadow(0 24px 48px rgba(8,120,200,.45)); }
  h1 { margin-top: 36px; font-size: 64px; font-weight: 800; letter-spacing: -.02em; }
  h1 span { color: #17a1a2; }
  p { margin-top: 12px; font-size: 26px; color: #8f97ad; }
</style>
</head>
<body>
  <!-- Extension icon, copied from assets-src/icon.svg -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-hidden="true">
  <!-- Palette taken from the Icedrive logo: blue #1463ce -> cyan #08c8d1, white "ice" shapes -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1459c4"/>
      <stop offset="0.55" stop-color="#1490d6"/>
      <stop offset="1" stop-color="#08c8d1"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f3fb"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- stem + flag -->
  <path d="M64 28 h11 c2 12 10 18 20 23 c8 4 12 12 9 22 c-2-8-8-12-18-14 c-4-1-8-2-11-4 v45 h-11z" fill="url(#ice)"/>
  <!-- ice-cube note head -->
  <g transform="translate(52 96)">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#ffffff"/>
    <polygon points="0,0 -19,-11 -19,11 0,22" fill="#bfe9f7"/>
    <polygon points="0,0 19,-11 19,11 0,22" fill="#7fd0ee"/>
  </g>
  <!-- sparkle -->
  <path d="M32 26 l3 9 9 3 -9 3 -3 9 -3-9 -9-3 9-3z" fill="#ffffff"/>
</svg>
  <h1>Icedrive Music <span>Player+</span></h1>
  <p>Chrome Extension</p>
</body>
</html>
