<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Icedrive Music Player+</title>
  </head>
  <body>
    <main id="app">
      <div id="banner-slot"></div>

      <div class="body">
        <section id="empty" class="empty" hidden>
          <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" /></svg>
          <p id="empty-text"></p>
        </section>

        <div id="player-slot"></div>

        <nav id="tabs" class="seg" role="tablist" aria-label="Panels" hidden>
          <button id="tab-tracks" class="seg-btn" type="button" role="tab" aria-selected="true" aria-controls="tracks-slot">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z" /></svg>
            Tracks
          </button>
          <button id="tab-eq" class="seg-btn" type="button" role="tab" aria-selected="false" aria-controls="eq-slot">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h2V6H7zm4 4h2V2h-2zm-8-8h2v-4H3zm12 4h2V6h-2zm4-8v4h2v-4z" /></svg>
            Equalizer
          </button>
        </nav>
        <div id="panels" class="panels" hidden>
          <div id="tracks-slot" role="tabpanel" aria-labelledby="tab-tracks"></div>
          <div id="eq-slot" role="tabpanel" aria-labelledby="tab-eq" hidden></div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
