<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Icedrive Music Player+</title>
  </head>
  <body>
    <main id="app">
      <header class="head">
        <img class="logo" src="/icon/96.png" width="30" height="30" alt="" />
        <div class="brand">
          <span class="brand-kicker">Icedrive</span>
          <span class="brand-name">Music Player<b>+</b></span>
        </div>
        <button id="detach" class="icon-btn" type="button" title="Open in a separate window" aria-label="Open in a separate window">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3z" /></svg>
        </button>
      </header>

      <div class="body">
        <section id="empty" class="empty" hidden>
          <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" /></svg>
          <p id="empty-text"></p>
        </section>

        <section id="player" class="player" hidden>
          <div class="now">
            <div id="art" class="art" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" /></svg>
            </div>
            <div class="meta">
              <div id="title" class="title"></div>
              <div id="artist" class="artist"></div>
              <div id="position" class="position"></div>
            </div>
          </div>

          <input id="seek" class="range seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek" />
          <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>

          <div class="controls">
            <button id="shuffle" class="ib toggle" type="button" title="Shuffle: off" aria-label="Shuffle" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04z" /></svg>
            </button>
            <button id="prev" class="ib" type="button" title="Previous (after 3 s: restart track)" aria-label="Previous">
              <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
            </button>
            <button id="play" class="ib main" type="button" title="Play / pause" aria-label="Play">
              <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
              <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M6 19h4V5H6zm8-14v14h4V5z" /></svg>
            </button>
            <button id="next" class="ib" type="button" title="Next" aria-label="Next">
              <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z" /></svg>
            </button>
            <button id="repeat" class="ib toggle" type="button" title="Repeat: off" aria-label="Repeat" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z" /></svg>
              <span id="repeat-one" class="badge" hidden>1</span>
            </button>
          </div>

          <div class="volume">
            <button id="mute" class="ib small" type="button" title="Mute" aria-label="Mute">
              <svg id="icon-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77" /></svg>
              <svg id="icon-muted" viewBox="0 0 24 24" hidden><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63m2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71M4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9zM12 4 9.91 6.09 12 8.18z" /></svg>
            </button>
            <input id="volume" class="range" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
            <span id="volume-pct" class="pct">100%</span>
            <select id="speed" class="select speed" title="Playback speed" aria-label="Playback speed"></select>
          </div>
        </section>

        <div id="eq-slot"></div>
        <div id="tracks-slot" hidden></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
