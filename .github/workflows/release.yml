name: Release

# Push a tag like v0.2.0 (matching "version" in package.json) to publish
# a GitHub Release with the packaged extension attached.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # `npm run verify` = type-check, tests, build, security gate
      # (scripts/verify-build.mjs) and npm audit. Fall back to type-check +
      # tests on branches that predate it.
      - name: Verify
        run: |
          if node -e "process.exit(require('./package.json').scripts?.verify ? 0 : 1)"; then
            npm run verify
          else
            npm run compile
            npm test
          fi

      - name: Build and zip (Chrome / Brave)
        run: npm run zip

      # Re-check the exact build that went into the zip.
      - name: Security check of packaged build
        run: npm run check:security --if-present

      - name: Checksums
        working-directory: .output
        run: sha256sum *.zip | tee SHA256SUMS.txt

      # Fails if CHANGELOG.md has no section for this version.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "${TAG#v}" release-notes.md .output

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .output/*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" .output/*.zip .output/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Icedrive Music Player+ $TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag
