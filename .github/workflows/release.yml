name: Release

# Publishes a GitHub Release with the packaged extension attached, either:
# - by pushing a tag like v0.2.0 that matches "version" in package.json, or
# - from Actions → Release → "Run workflow" on master, which creates the
#   v<package.json version> tag on that commit itself.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Resolve tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/master" ]; then
              echo "::error::Run the release from master (got $REF)."
              exit 1
            fi
            TAG="v$VERSION"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists. Bump the version in package.json and CHANGELOG.md first."
              exit 1
            fi
            echo "CREATE_TAG=true" >> "$GITHUB_ENV"
          else
            TAG="$REF_NAME"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match package.json version $VERSION (expected v$VERSION)."
              exit 1
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # `npm run verify` = type-check, tests, build, security gate
      # (scripts/verify-build.mjs) and npm audit. Fall back to type-check +
      # tests on branches that predate it.
      - name: Verify
        run: |
          if node -e "process.exit(require('./package.json').scripts?.verify ? 0 : 1)"; then
            npm run verify
          else
            npm run compile
            npm test
          fi

      - name: Build and zip (Chrome / Brave)
        run: npm run zip

      # Re-check the exact build that went into the zip.
      - name: Security check of packaged build
        run: npm run check:security --if-present

      # Signed .crx + update.xml, published next to the zip. Requires the
      # CRX_PRIVATE_KEY repository secret (see .github/RELEASING.md); without
      # it the release stops here, before any tag or release is created.
      # The key only ever exists in the runner's temp dir.
      - name: Sign .crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::CRX_PRIVATE_KEY secret is not set. Add it under Settings → Secrets and variables → Actions (see .github/RELEASING.md)."
            exit 1
          fi
          VERSION="${TAG#v}"
          ZIP=".output/icedrive-music-extension-$VERSION-chrome.zip"
          CRX="icedrive-music-extension-$VERSION-chrome.crx"
          KEY="$RUNNER_TEMP/crx-key.pem"
          trap 'rm -f "$KEY"' EXIT
          (umask 077 && printf '%s\n' "$CRX_PRIVATE_KEY" > "$KEY")
          node scripts/crx.mjs pack "$ZIP" "$KEY" ".output/$CRX"
          node scripts/crx.mjs verify ".output/$CRX"
          node scripts/crx.mjs update-xml ".output/$CRX" "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$CRX" .output/update.xml

      - name: Checksums
        working-directory: .output
        run: |
          shopt -s nullglob
          FILES=(*.zip *.crx)
          if [ -f update.xml ]; then FILES+=(update.xml); fi
          sha256sum "${FILES[@]}" | tee SHA256SUMS.txt

      # Fails if CHANGELOG.md has no section for this version.
      - name: Release notes
        run: node scripts/release-notes.mjs "${TAG#v}" release-notes.md .output

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .output/*.zip, .output/*.crx

      # Only for "Run workflow": tag the commit that was just built and tested.
      - name: Create tag
        if: env.CREATE_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          FILES=(.output/*.zip .output/*.crx .output/SHA256SUMS.txt)
          if [ -f .output/update.xml ]; then FILES+=(.output/update.xml); fi
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Icedrive Music Player+ $TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag
