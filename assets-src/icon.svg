<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Polar bear with headphones. Face details and headphone outlines are cut out of the
       white shape (mask), so the Icedrive-style blue -> cyan background shows through. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1459c4"/><stop offset=".55" stop-color="#1490d6"/><stop offset="1" stop-color="#08c8d1"/></linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f2fbfe"/><stop offset="1" stop-color="#d3f0fa"/></linearGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4f3fc"/><stop offset="1" stop-color="#9edcf2"/></linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <g transform="translate(0 7)">
      <!-- head, separated from ears and chest by a background-coloured gap -->
      <path d="M64 25 C 87 25, 101 37, 103 53 C 109 59, 111 69, 105 75 C 108 84, 99 92, 90 94 C 82 102, 46 102, 38 94 C 29 92, 20 84, 23 75 C 17 69, 19 59, 25 53 C 27 37, 41 25, 64 25 Z" fill="white" stroke="black" stroke-width="6"/>
      <path d="M64 25 C 87 25, 101 37, 103 53 C 109 59, 111 69, 105 75 C 108 84, 99 92, 90 94 C 82 102, 46 102, 38 94 C 29 92, 20 84, 23 75 C 17 69, 19 59, 25 53 C 27 37, 41 25, 64 25 Z" fill="white"/>
      <!-- ears drawn over the head, outlined by a gap, so they continue under the headband -->
      <circle cx="28" cy="30" r="15" fill="white" stroke="black" stroke-width="5"/><circle cx="28" cy="30" r="15" fill="white"/><circle cx="28" cy="31" r="6" fill="black"/>
      <circle cx="100" cy="30" r="15" fill="white" stroke="black" stroke-width="5"/><circle cx="100" cy="30" r="15" fill="white"/><circle cx="100" cy="31" r="6" fill="black"/>
      <!-- face cut-outs -->
      <path d="M54 68 C 54 62, 74 62, 74 68 C 74 74, 67 78, 64 78 C 61 78, 54 74, 54 68 Z" fill="black" transform="translate(0 3)"/>
      <path d="M64 81 v4 M56 88 q8 4 16 0 M42 58 q6.5 4 13 0 M73 58 q6.5 4 13 0" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <!-- headphones: same colour, outlined by gaps -->
      <path d="M24.7 45.2 C 33 2, 95 2, 103.3 45.2" fill="none" stroke="black" stroke-width="12" stroke-linecap="round"/>
      <path d="M24.7 45.2 C 33 2, 95 2, 103.3 45.2" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
      <g transform="rotate(10 23 55)">
      <rect x="8" y="33" width="30" height="44" rx="14" fill="black"/>
      <rect x="11" y="36" width="24" height="38" rx="11" fill="white"/>
      <path d="M19 45 q-5 10 0 20" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/></g>
      <g transform="rotate(-10 105 55)">
      <rect x="90" y="33" width="30" height="44" rx="14" fill="black"/>
      <rect x="93" y="36" width="24" height="38" rx="11" fill="white"/>
      <path d="M109 45 q5 10 0 20" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/></g>
      </g>
    </mask>
    <mask id="clip"><rect x="4" y="4" width="120" height="120" rx="28" fill="white"/></mask>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <g mask="url(#clip)"><rect width="128" height="128" fill="url(#fur)" mask="url(#m)"/>
  </g>
</svg>